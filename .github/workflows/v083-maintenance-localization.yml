name: One-shot v0.8.3 localization maintenance

on:
  push:
    branches: [maint/v0.8.3-adaptation]
    paths:
      - ".github/workflows/v083-maintenance-localization.yml"

permissions:
  contents: write

jobs:
  sync-v083-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Materialize tracked master and v0.8.3 stable sources
        run: |
          python tools/prepare_tree.py --worktree _upstream_master --ref main --no-submodules
          python tools/prepare_tree.py --worktree _upstream_stable --ref v0.8.3 --no-submodules

      - name: Refresh master and v0.8.3 stable catalogs
        run: |
          python tools/scan_ui.py --source _upstream_master --channel master --upstream-ref main --update --report reports/master-localization-scan.md
          python tools/scan_ui.py --source _upstream_stable --channel stable --upstream-ref v0.8.3 --update --report reports/stable-localization-scan.md

      - name: Apply reviewed v0.8.3 translations
        shell: bash
        run: |
          PYTHONPATH=tools python - <<'PY'
          from loclib import LOC, localization_channel_paths, load_json, save_json

          translations = {
              "Enable NR processing.": "启用 NR 处理。",
              "Show or hide the NR effect. The model still runs when hidden.\nDisable Enable Neural Rendering to stop its GPU cost.": "显示或隐藏 NR 效果。隐藏时模型仍会运行。\n关闭“启用神经渲染”可停止其 GPU 开销。",
              "Apply NR after game effects and HUD. Early generation carries the edit through a separate upscaler.": "在游戏后期效果和 HUD 之后应用 NR。较早阶段生成的编辑结果会通过独立升频器传递。",
              "Keep the game's SR/RR input clean and upscale only the NR edit with a separate non-RR backend.\nApply after upscale, or at presentation when finished-picture mode is enabled.": "保持游戏的 SR/RR 输入不受影响，仅使用独立的非 RR 后端升频 NR 编辑结果。\n在升频后应用；启用完成画面模式时则在呈现阶段应用。",
              "Private NR upscaler": "独立 NR 升频器",
              "Inspect NR": "检查 NR",
              "Match HDR brightness response (experimental)": "匹配 HDR 亮度响应（实验性）",
              "%u exposure candidates": "%u 个曝光候选",
              "Exposure candidate found.": "已找到曝光候选。",
              "Unverified exposure candidate.": "未验证的曝光候选。",
              "This option needs DirectX 12 or a DirectX 11 upscaler marked w/Dx12.": "此选项需要 DirectX 12，或标记为 w/Dx12 的 DirectX 11 升频器。",
              "Private upscale: %s": "独立升频：%s",
              "The private edit-upscale path requires DirectX 12 or its bridge. Disable separate edit upscaling to use native Vulkan NR.": "独立编辑升频路径需要 DirectX 12 或其桥接层。要使用原生 Vulkan NR，请关闭独立编辑升频。",
              "RTX 40 MFG unlock (restart)": "RTX 40 MFG 解锁（需重启）",
              "Experimental. Save Settings and restart. Requires a supported DLSSG runtime.\nDo not combine with another MFG unlocker.": "实验性功能。保存设置并重启。需要受支持的 DLSSG 运行时。\n请勿与其他 MFG 解锁器同时使用。",
              "Save Settings and restart to apply this change.": "保存设置并重启以应用此更改。",
              "Waiting for DLSSG to load.": "正在等待 DLSSG 加载。",
              "DLSSG %s: RTX 40 MFG unlock applied.": "DLSSG %s：已应用 RTX 40 MFG 解锁。",
              "DLSSG %s: unlock unavailable for this runtime.": "DLSSG %s：此运行时无法解锁。",
              "Waiting for frame timing.": "正在等待帧时序。",
              "NR %.2f ms  |  Rest of frame ~%.2f ms": "NR %.2f ms  |  帧其余部分约 %.2f ms",
              "NR GPU time versus frame interval. Work can overlap.": "NR GPU 时间与帧间隔对比。两者可能重叠执行。",
              "Rendered frame: %.2f ms%s": "渲染帧：%.2f ms%s",
              " (NR overlaps/exceeds this interval)": " （NR 与该间隔重叠/超过该间隔）",
          }

          zh_path = LOC / "zh-CN.json"
          zh = load_json(zh_path, {"locale": "zh-CN", "entries": {}})
          zentries = zh.setdefault("entries", {})
          found_sources = set()

          for channel in ("master", "stable"):
              catalog = load_json(localization_channel_paths(channel)["catalog"], {"entries": {}})
              for key, entry in catalog.get("entries", {}).items():
                  if entry.get("obsolete"):
                      continue
                  source = entry.get("source", "")
                  if source not in translations:
                      continue
                  zentries[key] = {
                      "text": translations[source],
                      "state": "reviewed",
                      "source_hash": entry["source_hash"],
                      "note": "v0.8.3 manually reviewed translation",
                  }
                  found_sources.add(source)

          missing_sources = set(translations) - found_sources
          if missing_sources:
              raise SystemExit("Reviewed source strings not found in v0.8.3 stable catalog: " + repr(sorted(missing_sources)))
          save_json(zh_path, zh)
          print(f"Applied {len(found_sources)} reviewed v0.8.3 source translations")
          PY

      - name: Synchronize translation memory
        run: python tools/update_translation_memory.py

      - name: Require complete localization
        run: python tools/check_localization.py --channel all --strict

      - name: Verify source integration
        run: |
          python tools/localize_source.py --source _upstream_master --channel master
          python tools/localize_source.py --source _upstream_stable --channel stable

      - name: Persist localization files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Localization
          if git diff --cached --quiet; then
            echo "No localization changes to persist."
            exit 0
          fi
          git commit -m "localization: update reviewed stable catalog for v0.8.3"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: v083-localization-maintenance
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
