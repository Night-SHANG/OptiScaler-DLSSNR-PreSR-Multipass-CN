name: Localization Check - OptiScaler DLSSNR Pre-SR Multipass CN

on:
  workflow_dispatch:
  pull_request:
    paths: ["Localization/**", "tools/**", "overlay/**", ".github/workflows/**", "upstream.json"]
  push:
    branches: [main, master]
    paths: ["Localization/**", "tools/**", "overlay/**", ".github/workflows/**", "upstream.json"]

concurrency:
  group: localization-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Python syntax and unit tests
        run: |
          python -m compileall -q tools tests
          python -m unittest discover -s tests -v
      - name: Validate translation resources
        run: python tools/check_localization.py --channel all --strict
      - name: Verify reviewed translation memory is synchronized
        run: python tools/update_translation_memory.py --check
      - name: Generate translation header
        run: |
          python tools/generate_cpp.py --channel master --out /tmp/Strings.master.generated.h
          python tools/generate_cpp.py --channel stable --out /tmp/Strings.stable.generated.h
